# Déploiement Render : New → Blueprint → choisir ce dépôt.
# Render ne demande qu'une chose : ADMIN_PASSWORD (le mot de passe de ton back-office).
# Toutes les autres clés (Anthropic, Stripe, emails) se collent ensuite dans le back-office → Paramètres.
services:
  - type: web
    name: votreiapro-qg
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22.13.0"
      - key: ADMIN_PASSWORD
        sync: false
