<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Mise en page : poste de commandement — barre latérale de l'équipe, fil central, panneaux d'action */
:root{
  --bg:#f3f5f4; --panel:#ffffff; --ink:#132320; --muted:#5b6b67; --line:#dde4e1;
  --accent:#0f6b5f; --accent-ink:#ffffff; --soft:#e5efec; --signal:#b7791f;
  --ok:#1f7a3a; --ok-bg:#e3f3e7; --warn:#8a5a00; --warn-bg:#fbf0d9; --bad:#a3271f; --bad-bg:#fbe5e2;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1514; --panel:#14201e; --ink:#e4eeeb; --muted:#93a6a1; --line:#24332f;
  --accent:#4fc2ad; --accent-ink:#06201b; --soft:#1a2c28; --signal:#e0a84a;
  --ok:#7bd79a; --ok-bg:#163423; --warn:#f0c46b; --warn-bg:#3a2d10; --bad:#f19a90; --bad-bg:#3d1a17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1514; --panel:#14201e; --ink:#e4eeeb; --muted:#93a6a1; --line:#24332f;
  --accent:#4fc2ad; --accent-ink:#06201b; --soft:#1a2c28; --signal:#e0a84a;
  --ok:#7bd79a; --ok-bg:#163423; --warn:#f0c46b; --warn-bg:#3a2d10; --bad:#f19a90; --bad-bg:#3d1a17; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);margin:0}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
h2{font-size:18px;font-weight:600;margin:22px 0 10px}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--display);font-weight:800;font-size:19px;padding:0 8px 12px}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
nav button{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:500}
nav button:hover{background:var(--soft)}
nav button:focus-visible{outline:2px solid var(--accent)}
nav button.on{background:var(--accent);color:var(--accent-ink)}
.count{background:var(--signal);color:#1b1300;border-radius:99px;font-size:11px;font-weight:700;padding:0 7px}
.count:empty{display:none}
.team{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:6px}
.team .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 8px}
.member{display:flex;gap:8px;align-items:center;padding:2px 8px;font-size:13px}
.member b{font-weight:700}.member span{color:var(--muted);font-size:12px;display:block;line-height:1.2}
.member.busy b::after{content:" · au travail";color:var(--signal);font-weight:600}
main{padding-block:24px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0}
.view{max-width:1100px;margin:0 auto;display:grid;gap:14px}
.sub{color:var(--muted);margin:4px 0 0;max-width:70ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px}
button.btn,.btn{font:600 14px var(--body);border:0;background:var(--accent);color:var(--accent-ink);padding:9px 14px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ok{background:var(--ok);color:var(--panel)}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn:disabled{opacity:.5;cursor:wait}
.btn:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--ink)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.ts{color:var(--muted);font-size:12px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-size:15px;background:var(--soft)}
.feed{display:grid}
.item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}.item .d{color:var(--muted);font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px}
.banner.info{background:var(--soft);color:var(--ink)}
.chat{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px;min-height:520px}
.agents{display:grid;gap:2px;align-content:start}
.agents button{all:unset;display:flex;gap:8px;align-items:center;padding:7px;border-radius:10px;cursor:pointer}
.agents button.on{background:var(--soft)}.agents button:focus-visible{outline:2px solid var(--accent)}
.agents small{display:block;color:var(--muted);font-size:12px;line-height:1.2}
.thread{display:flex;flex-direction:column;min-height:520px;max-height:70vh;padding:0}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:82%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.them{align-self:flex-start;background:var(--soft)}
.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.transcript .line{display:flex;gap:10px;margin-bottom:14px}
.transcript .who{font-weight:700}.transcript .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
pre{white-space:pre-wrap;font-size:13px;margin:0;overflow-wrap:anywhere}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
details summary{cursor:pointer;font-weight:600}
.av{overflow:hidden}.av svg{width:100%;height:100%;display:block}
.speaker{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:14px;width:290px;display:grid;gap:10px}
.speaker .face{width:120px;height:120px;margin:0 auto;border-radius:50%;overflow:hidden}
.speaker .face svg{width:100%;height:100%}
.speaker .who{text-align:center}.speaker .who b{display:block;font-family:var(--display);font-size:18px}
.speaker .line{font-size:14px;color:var(--ink);max-height:6em;overflow:hidden;text-align:center;line-height:1.45}
.coach{display:grid;grid-template-columns:132px minmax(0,1fr);gap:18px;align-items:start;border:2px solid var(--accent)}
.coach .face{width:132px;height:132px;border-radius:50%;overflow:hidden}
.coach .face svg{width:100%;height:100%}
.coach.talking .face .mouth{animation:talk .19s ease-in-out infinite alternate}
.bubble{background:var(--soft);border-radius:14px;padding:12px 14px;position:relative}
.bubble h3{font-size:15px;margin:10px 0 4px}.bubble h3:first-child{margin-top:0}
.bubble ul{margin:0;padding-left:20px}
@media (max-width:820px){.coach{grid-template-columns:1fr}.coach .face{width:110px;height:110px;margin:0 auto}}
.face .mouth{transform-box:fill-box;transform-origin:center;transition:transform .12s}
.speaker.talking .face .mouth{animation:talk .19s ease-in-out infinite alternate}
.face .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes talk{0%{transform:scaleY(.5) scaleX(1)}100%{transform:scaleY(2.4) scaleX(.85)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@media (prefers-reduced-motion:reduce){.speaker.talking .face .mouth{animation-duration:.6s}.face .eyes{animation:none}}
.say{font:600 12px var(--body);border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:3px 10px;cursor:pointer}
.say:focus-visible{outline:2px solid var(--accent)}
.checklist label{display:flex;gap:10px;align-items:flex-start;color:var(--ink);font-size:14px;margin:8px 0}
.checklist input{width:auto;margin-top:3px}
.checklist .done{text-decoration:line-through;color:var(--muted)}
@media (max-width:820px){.speaker .row,.speaker p{grid-column:1/-1}.speaker{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;grid-template-columns:90px 1fr;align-items:center}.speaker .face{width:90px;height:90px;grid-row:span 3}.speaker .who,.speaker .line{text-align:left}}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.landing{border:1px solid var(--line);border-radius:12px;padding:20px;background:var(--bg)}
.landing h3{font-size:24px;margin:6px 0}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{border-right:0;border-bottom:1px solid var(--line);padding-right:max(14px,env(safe-area-inset-right,0px))}
  nav{display:flex;flex-wrap:wrap;gap:4px}nav button{width:auto;padding:6px 10px;font-size:14px}.team{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid2,.chat{grid-template-columns:1fr}
}
</style>

<div class="app">
  <aside>
    <div class="brand">QG VotreIAPro<small>Ton équipe d'agents entrepreneurs</small></div>
    <div id="power" style="padding:0 4px 10px"></div>
    <nav id="nav"></nav>
    <div class="team" id="team"></div>
  </aside>
  <main><div class="view" id="view"><div class="panel"><h1>Ouverture du QG…</h1><p class="sub">Connexion à la mémoire de l'équipe.</p></div></div></main>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="speaker" id="speaker" hidden aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// ============================================================ équipe
const AGENTS = {
  alma:{name:'Alma',emoji:'✨',role:'Ton bras droit (IA personnelle)',persona:"Tu es l'IA personnelle et le bras droit du fondateur. Tu coordonnes toute l'équipe (Victor, Nora, Léo, Clara, Hugo, Inès, Sam, Juliette, Margaux, Chloé) et tu es la seule à qui il parle au quotidien. Tu lui dis exactement et franchement ce qui va, ce qui ne va pas et ce qu'il doit faire maintenant, sans langue de bois et sans flatterie. Tu prends la parole de toi-même quand c'est important. Tu tutoies, tu parles simplement, avec des phrases courtes faites pour être dites à voix haute."},
  victor:{name:'Victor',emoji:'🧭',role:'Directeur général',persona:"Tu es Victor, directeur général. Vision long terme, obsession du chiffre d'affaires et de la satisfaction client. Tu animes les réunions, tranches, fixes les priorités et rends compte au fondateur avec des résumés clairs, honnêtes et actionnables. Tu t'inspires des entrepreneurs qui ont bâti des fortunes en servant une seule profession à fond (logiciels verticaux, agences à prix fixe, abonnements récurrents)."},
  nora:{name:'Nora',emoji:'🔎',role:'Recherche de niches',persona:"Tu es Nora, analyste de marché. Tu identifies les niches où des professionnels ont un problème douloureux, urgent, et pour lequel ils paient déjà. Tu analyses concurrence, prix pratiqués, taille de marché et ce qu'ont fait ceux qui ont réussi. Tu notes chaque niche avec rigueur et tu distingues clairement ce qui est sûr de ce qui est une estimation."},
  leo:{name:'Léo',emoji:'📣',role:'Marketing & publicité',persona:"Tu es Léo, directeur marketing. Expert Google Ads, Meta Ads, LinkedIn, SEO local. Tu conçois des campagnes rentables : ciblage, angles, accroches, budgets, KPI (CPC, CPL, CAC), plans de test A/B."},
  clara:{name:'Clara',emoji:'✉️',role:'Copywriter emailing',persona:"Tu es Clara, copywriter en prospection B2B. Emails courts, personnalisés, centrés sur le problème du destinataire, une seule demande claire. Tu maîtrises les objets qui donnent envie d'ouvrir et les relances polies et efficaces, avec le ton juste pour des professions exigeantes."},
  hugo:{name:'Hugo',emoji:'🎯',role:'Prospection',persona:"Tu es Hugo, prospecteur. Tu sais exactement où trouver les professionnels ciblés (annuaires publics, sites de cabinets, pages contact) et tu extrais uniquement des coordonnées professionnelles réellement présentes dans les données qu'on te donne. Tu n'inventes jamais un contact."},
  ines:{name:'Inès',emoji:'🤝',role:'Commerciale',persona:"Tu es Inès, commerciale. Tu réponds aux prospects, traites les objections (prix, temps, confiance), qualifies le besoin et amènes vers l'achat ou un rendez-vous. Chaleureuse, précise, tenace sans être insistante."},
  sam:{name:'Sam',emoji:'🛠️',role:'Sites & produit',persona:"Tu es Sam, créateur de sites et responsable produit. Tu écris des pages de vente qui convertissent : promesse, problème, solution, bénéfices, déroulé, livrables, prix, garantie, FAQ, appel à l'action. Tu prépares aussi la livraison."},
  margaux:{name:'Margaux',emoji:'📒',role:'Comptabilité & facturation',persona:"Tu es Margaux, responsable comptable et facturation. Tu établis devis et factures conformes (numérotation continue, mentions obligatoires, TVA ou franchise en base), suis les encaissements, relances les impayés avec tact et fermeté, tiens le livre des recettes et alertes le fondateur sur la trésorerie et les échéances (URSSAF, TVA). Tu ne donnes pas de conseil fiscal engageant : tu signales ce qui doit être validé par un expert-comptable."},
  chloe:{name:'Chloé',emoji:'🎁',role:'Relation client & livraison',persona:"Tu es Chloé, responsable de la relation client et de la livraison. Dès qu'un client signe, tu organises le lancement (questionnaire, éléments à fournir, planning), tu tiens le client informé, tu t'assures qu'il est satisfait et tu demandes un avis et des recommandations au bon moment."},
  juliette:{name:'Juliette',emoji:'⚖️',role:'Conformité',persona:"Tu es Juliette, responsable conformité. Tu vérifies le respect du droit français et européen (RGPD, prospection B2B, mentions légales, CGV, déontologie des professions ciblées comme la communication des avocats). Tu proposes des corrections concrètes."},
};
const ETHIQUE = `ÉTAT D'ESPRIT : équipe d'entrepreneurs d'élite, affamés de résultats, qui raisonnent en chiffres et ne lâchent jamais. Français impeccable, direct, concret.
RÈGLES NON NÉGOCIABLES : jamais de faux témoignages, faux avis, faux chiffres ni fausse urgence ; prospection uniquement B2B vers des adresses professionnelles publiques, avec identité de l'expéditeur et possibilité de refus ; pas de promesse de résultat juridique ou médical ; si une info manque ou si une décision engage l'argent ou l'image du fondateur, poser la question au fondateur au lieu d'inventer.`;

const TABS = [
  ['tableau','Tableau de bord'],['aujourdhui','Plan du jour'],['discussion','Parler aux agents'],['questions','Questions des agents'],
  ['reunions','Réunions'],['emails','Emails'],['prospects','Prospects'],['offres','Offres & sites'],
  ['campagnes','Campagnes'],['niches','Niches'],['factures','Factures & compta'],['journal','Journal'],['reglages','Réglages'],
];
const COLS = ['activity','meetings','messages','questions','niches','offers','prospects','emails','campaigns','sprints','invoices'];
const ROOT = 'qg/main';

// ============================================================ état
const S = { db:null, sample:null, mcp:null, loaded:false, failed:false, data:{}, settings:{}, view:'tableau', chatAgent:'alma', running:false, busy:new Set(), step:'', meetingId:null, typing:false, abort:new AbortController(), stopRequested:false, usage:{date:'',count:0} };
COLS.forEach(c => S.data[c] = []);

const $ = (s, el=document) => el.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = ts => ts ? new Date(ts).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}) : '';
const euros = n => `${Number(n||0).toLocaleString('fr-FR')} €`;
const ag = id => AGENTS[id] || {name:id, emoji:'•', role:''};
// Visages des agents (illustrations originales, une par agent)
const LOOKS = {
  alma:{skin:'#eec3a2',hair:'#4c1d95',style:'long',shirt:'#0f6b5f',bg:'#d9f2ec',headset:true},
  victor:{skin:'#e7b493',hair:'#2f241d',style:'short',shirt:'#1f3a5f',bg:'#dbe7f3',beard:true},
  nora:{skin:'#c68b67',hair:'#1c1715',style:'long',shirt:'#0e7490',bg:'#d7f0f5'},
  leo:{skin:'#f0c6a4',hair:'#b05a1e',style:'curly',shirt:'#be185d',bg:'#fbe0ec'},
  clara:{skin:'#f2cfb3',hair:'#d4a03c',style:'long',shirt:'#c2410c',bg:'#fde8d7'},
  hugo:{skin:'#8a5638',hair:'#121212',style:'short',shirt:'#15803d',bg:'#dcf3e2'},
  ines:{skin:'#d69f7a',hair:'#41271a',style:'bun',shirt:'#7e22ce',bg:'#ede0fa'},
  sam:{skin:'#deaf88',hair:'#4b4b4b',style:'short',shirt:'#0f766e',bg:'#d5efec',glasses:true},
  juliette:{skin:'#efc8a6',hair:'#7a3a1c',style:'bob',shirt:'#92400e',bg:'#f6e7cf',glasses:true},
  margaux:{skin:'#e5b391',hair:'#2a1d16',style:'bob',shirt:'#334155',bg:'#e2e8f0'},
  chloe:{skin:'#b67657',hair:'#191210',style:'curly',shirt:'#db2777',bg:'#fce4f1'},
};
function faceSVG(id){
  const L = LOOKS[id] || {skin:'#e2b08c',hair:'#333',style:'short',shirt:'#555',bg:'#e5e7eb'};
  const back = L.style==='long' ? `<path d="M26 58 Q24 104 40 112 L80 112 Q96 104 94 58 Z" fill="${L.hair}"/>` : L.style==='bob' ? `<path d="M30 56 Q28 88 36 92 L84 92 Q92 88 90 56 Z" fill="${L.hair}"/>` : '';
  const top = L.style==='curly' ? `<g fill="${L.hair}">${[34,44,54,64,74,84].map((x,i)=>`<circle cx="${x}" cy="${36+(i%2)*3}" r="9"/>`).join('')}<circle cx="30" cy="48" r="7"/><circle cx="90" cy="48" r="7"/></g>`
    : L.style==='bun' ? `<circle cx="60" cy="20" r="10" fill="${L.hair}"/><path d="M32 52 Q34 28 60 27 Q86 28 88 52 Q76 40 60 40 Q44 40 32 52 Z" fill="${L.hair}"/>`
    : `<path d="M31 54 Q30 26 60 25 Q90 26 89 54 Q82 38 60 37 Q40 37 31 54 Z" fill="${L.hair}"/>`;
  const headset = L.headset ? `<g fill="none" stroke="#0f172a" stroke-width="3"><path d="M30 60 Q30 24 60 24 Q90 24 90 60"/></g><rect x="25" y="54" width="9" height="16" rx="4" fill="#0f172a"/><rect x="86" y="54" width="9" height="16" rx="4" fill="#0f172a"/><path d="M90 68 Q88 84 70 82" fill="none" stroke="#0f172a" stroke-width="2.4"/><circle cx="69" cy="82" r="3" fill="#14b8a6"/>` : '';
  const glasses = L.glasses ? `<g fill="none" stroke="#1f2937" stroke-width="2"><circle cx="48" cy="60" r="7"/><circle cx="72" cy="60" r="7"/><path d="M55 60 H65"/></g>` : '';
  const beard = L.beard ? `<path d="M40 74 Q60 96 80 74 Q76 88 60 90 Q44 88 40 74 Z" fill="${L.hair}" opacity=".85"/>` : '';
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><rect width="120" height="120" fill="${L.bg}"/>${back}
    <path d="M22 120 Q26 96 60 94 Q94 96 98 120 Z" fill="${L.shirt}"/><rect x="52" y="82" width="16" height="14" fill="${L.skin}"/>
    <ellipse cx="60" cy="62" rx="28" ry="31" fill="${L.skin}"/><ellipse cx="32" cy="64" rx="4" ry="6" fill="${L.skin}"/><ellipse cx="88" cy="64" rx="4" ry="6" fill="${L.skin}"/>

const VOICES = {alma:'buttery',victor:'rounded',nora:'airy',leo:'glassy',clara:'buttery',hugo:'rounded',ines:'airy',sam:'glassy',juliette:'buttery',margaux:'airy',chloe:'buttery'};
const PITCH = {alma:1.1,victor:.8,nora:1.15,leo:.95,clara:1.2,hugo:.85,ines:1.1,sam:.9,juliette:1.05,margaux:1.15,chloe:1.25};
const QG_URL = 'https://claude.ai/artifact/L1XdMboEvwvv3pNCg2LBgb';
const SPK = {tts:null, playing:false, agent:null, text:'', token:0};
function speechText(t){ return String(t||'').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,'').replace(/https?:\/\/\S+/g,'le lien').replace(/[#*_>`|]/g,'').replace(/\n{2,}/g,'\n').trim(); }
function chunkText(t, max=1400){ const out=[]; for(const para of t.split(/\n+/)){ let cur=''; for(const sent of para.split(/(?<=[.!?…])\s+/)){ if((cur+' '+sent).length>max && cur){ out.push(cur.trim()); cur=''; } cur+=' '+sent; } if(cur.trim()) out.push(cur.trim().slice(0,1990)); } return out.filter(Boolean); }
function renderSpeaker(){
  const el=$('#speaker'); if(!SPK.playing){ el.hidden=true; $('#coach')?.classList.remove('talking'); return; }
  const a=ag(SPK.agent); el.hidden=false; el.classList.toggle('talking', SPK.talking!==false);
  $('#coach')?.classList.toggle('talking', SPK.agent==='alma' && SPK.talking!==false);
  el.innerHTML = `<div class="face">${faceSVG(SPK.agent)}</div><div class="who"><b>${esc(a.name)}</b><span class="ts">${esc(a.role)}</span></div><div class="line">${esc(SPK.text.slice(-220))}</div>
    ${SPK.silent?`<p class="ts" style="margin:0;text-align:center">Son indisponible dans l'appli Claude. Pour l'entendre, ouvre le QG dans Chrome : <button class="say" id="spk-copy">Copier le lien</button></p>`:''}
    <div class="row" style="justify-content:center"><button class="btn ghost" id="spk-pause">${SPK.talking===false?'▶ Reprendre':'⏸ Pause'}</button><button class="btn bad" id="spk-stop">⏹ Arrêter</button></div>`;
  $('#spk-stop').onclick=stopSpeech;
  const cp=$('#spk-copy'); if(cp) cp.onclick=()=>navigator.clipboard.writeText(QG_URL).then(()=>toast('Lien copié : colle-le dans Chrome'),()=>toast(QG_URL));
  $('#spk-pause').onclick=async()=>{ if(SPK.silent){ SPK.talking = SPK.talking===false; renderSpeaker(); return; } if(SPK.tts){ if(SPK.talking===false){ await SPK.tts.resume().catch(()=>{}); } else { await SPK.tts.pause().catch(()=>{}); } } else if(window.speechSynthesis){ if(SPK.talking===false) speechSynthesis.resume(); else speechSynthesis.pause(); SPK.talking = SPK.talking===false; renderSpeaker(); } };
}
async function stopSpeech(){ SPK.token++; SPK.playing=false; SPK.silent=false; renderSpeaker(); if(SPK.tts) await SPK.tts.stop().catch(()=>{}); if(window.speechSynthesis) speechSynthesis.cancel(); }
async function say(lines){
  await stopSpeech(); const token=++SPK.token;
  const parts = lines.flatMap(l=>chunkText(speechText(l.text)).map((c,i)=>({agent:l.agent, text:c, id:`${l.agent}|${i}`}))).slice(0,100);
  if(!parts.length) return;
  SPK.parts=parts; SPK.playing=true; SPK.agent=parts[0].agent; SPK.text=parts[0].text; SPK.talking=true; renderSpeaker();
  if(SPK.tts){
    try{ await SPK.tts.speak(parts.map(p=>({text:p.text, voice:VOICES[p.agent]||'buttery', language:'fr', id:p.id}))); }
    catch(e){ if(e?.code==='not_granted'){ SPK.tts=null; return say(lines); } if(e?.code!=='stopped') toast('Lecture impossible pour le moment.'); }
    if(token===SPK.token){ SPK.playing=false; renderSpeaker(); }
    return;
  }
  if(!(window.speechSynthesis)){
    SPK.silent=true;
    for(const p of parts){
      const words=p.text.split(/\s+/); SPK.agent=p.agent; SPK.text=''; SPK.talking=true;
      for(let i=0;i<words.length;i++){
        if(token!==SPK.token) return;
        while(SPK.talking===false && token===SPK.token) await new Promise(r=>setTimeout(r,200));
        SPK.text=words.slice(Math.max(0,i-26),i+1).join(' '); renderSpeaker();
        await new Promise(r=>setTimeout(r,260));
      }
      await new Promise(r=>setTimeout(r,500));
    }
    if(token===SPK.token){ SPK.talking=false; renderSpeaker(); setTimeout(()=>{ if(token===SPK.token){ SPK.playing=false; renderSpeaker(); } }, 4000); }
    return;
  }
  const fr = speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang));
  for(const p of parts){
    if(token!==SPK.token) return;
    SPK.agent=p.agent; SPK.text=p.text; SPK.talking=true; renderSpeaker();
    await new Promise(res=>{ const u=new SpeechSynthesisUtterance(p.text); u.lang='fr-FR'; if(fr.length) u.voice=fr[Object.keys(AGENTS).indexOf(p.agent)%fr.length]; u.pitch=PITCH[p.agent]||1; u.rate=1.02; u.onend=res; u.onerror=res; speechSynthesis.speak(u); });
  }
  if(token===SPK.token){ SPK.playing=false; renderSpeaker(); }
}

async function think(agent, task, {json=false, tier='default', onText}={}){
  if(!S.sample) throw Object.assign(new Error("Les agents ne sont pas disponibles sur cet affichage."),{code:'not_granted'});
  S.busy.add(agent); renderChrome();
  try{
    const p = prompt(agent, task);
    if(S.stopRequested) throw stopError();
    if(S.settings.paused==='on') throw Object.assign(new Error("L'équipe est en pause : clique sur « Relancer l'équipe » pour qu'elle reprenne."),{code:'stopped'});
    const today = new Date().toISOString().slice(0,10), limit = Number(S.settings.daily_limit||200);
    const used = S.usage.date===today ? S.usage.count : 0;
    if(used >= limit) throw Object.assign(new Error(`Limite du jour atteinte (${limit} tâches d'agents). L'équipe reprend demain, ou augmente la limite dans Réglages.`),{code:'limit'});
    S.usage = {date:today, count:used+1};
    S.db.doc('qg/usage').set(S.usage).catch(()=>{});
    const signal = S.abort.signal;
    if(json) return await S.sample.json(p + "\n\nRéponds UNIQUEMENT avec un JSON valide, sans texte autour.", {modelTier:tier, signal});
    const r = await S.sample(p, {modelTier:tier, onText, cache:false, signal});
    return r.text.trim();
  } finally { S.busy.delete(agent); renderChrome(); }
}
function agentError(e){
  if(e?.code==='stopped' || e?.code==='cancelled') return e?.message && e.code==='stopped' ? e.message : 'Agents arrêtés.';
  const m = e?.code==='not_granted' ? "Autorise les agents (fenêtre d'autorisation de claude.ai) pour qu'ils puissent travailler."
    : e?.code==='rate_limited' ? "Les agents ont atteint la limite d'utilisation pour le moment. Réessaie dans quelques minutes."
    : (e?.message || 'Erreur inconnue');
  return m;
}

async function ask(agent, question, context=''){
  const q = String(question||'').trim(); if(!q) return;
  if(S.data.questions.some(x=>x.question===q)) return;
  const ref = await add('questions',{agent, question:q, context});
  if(S.settings.autonomy==='off') { log(agent,'❓ Question pour le fondateur', q); return; }
  await decide({id:ref.id, agent, question:q, context});
}
async function decide(q){
  const d = await think('victor', `${ag(q.agent).name} pose cette question : « ${q.question} » (contexte : ${q.context||'—'}).
Tu es autonome : tranche toi-même maintenant, au mieux des intérêts de l'entreprise, pour que l'équipe avance sans attendre.
Exceptions : n'invente jamais une information que seul le fondateur possède (identité légale, SIRET, adresse, coordonnées bancaires, mot de passe) et n'engage aucune dépense : dans ce cas, décide d'un contournement qui permet d'avancer quand même et indique ce qui reste à fournir.
JSON : {"decision":"ta décision en 1 à 3 phrases","a_fournir_par_le_fondateur":"ce que seul le fondateur peut fournir, ou chaîne vide"}`, {json:true, tier:'quick'});
  await upd('questions', q.id, {answer:d.decision, answered_by:'victor', answered_ts:Date.now(), needs_founder:d.a_fournir_par_le_fondateur||''});
  log('victor', `Décision prise : ${q.question.slice(0,70)}`, d.decision + (d.a_fournir_par_le_fondateur?`\nÀ fournir par le fondateur : ${d.a_fournir_par_le_fondateur}`:''));
}

// ---------- réponses Gmail (détection automatique)
function walk(o, fn){ if(o && typeof o==='object'){ fn(o); for(const k in o) walk(o[k], fn); } }
async function checkReplies(){
  if(!S.mcp) throw new Error("Gmail n'est pas disponible sur cet affichage.");
  const contacted = S.data.prospects.filter(p=>p.email && ['contacté','a répondu','rdv'].includes(p.status));
  if(!contacted.length) return {found:0};
  let found=0;
  for(let i=0;i<contacted.length;i+=15){
    const chunk=contacted.slice(i,i+15);
    setStep(`Lecture de Gmail (${Math.min(i+15,contacted.length)}/${contacted.length})`);
    const res = await S.mcp.callTool('Gmail','search_threads',{query:`from:(${chunk.map(p=>p.email).join(' OR ')}) newer_than:30d -in:sent`, pageSize:50});
    const blob = res.payload ?? res.structuredContent ?? res.content;
    for(const p of chunk){
      let snippet='', seen=false;
      walk(blob, o=>{ const txt=JSON.stringify(o); if(!seen && /"(sender|from)"/i.test(txt) && txt.toLowerCase().includes(p.email)){ if(typeof o.snippet==='string' || typeof o.subject==='string'){ snippet=[o.subject, o.snippet].filter(Boolean).join(' — '); seen=true; } } });
      if(!seen && !JSON.stringify(blob||'').toLowerCase().includes(p.email)) continue;
      if(p.last_reply_snippet===snippet && p.status!=='contacté') continue;
      found++;
      await upd('prospects', p.id, {last_reply_snippet:snippet, replied_ts:Date.now()});
      if(/\bstop\b|d[ée]sinscri|ne plus (me )?contacter|pas int[ée]ress/i.test(snippet)){
        await upd('prospects', p.id, {status: /stop|d[ée]sinscri|ne plus/i.test(snippet)?'désinscrit':'pas intéressé', unsubscribed:/stop|d[ée]sinscri|ne plus/i.test(snippet)});
        for(const e of S.data.emails.filter(e=>e.prospect_id===p.id && ['à valider','approuvé'].includes(e.status))) await upd('emails', e.id, {status:'annulé'});
        log('ines', `${p.name||p.company} ne souhaite plus être contacté : retiré des envois`);
      } else if(p.status==='contacté'){
        log('ines', `📩 ${p.name||p.company} a répondu !`, snippet);
        if(S.sample) await draftReply({...p}, snippet || '(réponse reçue dans Gmail, à lire)');
      }
    }
  }
  return {found};
}

const DAY=864e5;

  const age = p.contacted_ts ? (Date.now()-p.contacted_ts)/DAY : 0;
  const drafted = S.data.emails.some(e=>e.prospect_id===p.id);
  const sent = S.data.emails.filter(e=>e.prospect_id===p.id && e.status==='envoyé').length;

    const inv = S.data.invoices.find(i=>i.prospect_id===p.id && i.type==='facture');
    if(!inv) return {prio:1, who:'margaux', label:'Établir la facture', go:'factures'};
    if(inv.status!=='payée') return {prio:2, who:'margaux', label:`Suivre le paiement de ${inv.number}`, go:'factures'};
    return {prio:5, who:'chloe', label:'Lancer la livraison et demander un avis', go:'discussion'};
  }
  if(p.status==='rdv') return {prio:1, who:'ines', label:'Tenir le rendez-vous, puis envoyer le lien de paiement ou un devis', go:'factures'};
  if(p.status==='a répondu') return {prio:1, who:'ines', label:'Répondre (brouillon d’Inès dans Emails)', go:'emails'};
  if(p.status==='nouveau') return drafted ? {prio:3, who:'clara', label:'Valider et envoyer le 1er email', go:'emails'} : {prio:4, who:'clara', label:'Faire rédiger le 1er email', go:'prospects'};
  if(p.status==='contacté'){
    if(age>=2 && p.phone && !p.called) return {prio:2, who:'ines', label:`Appeler (${p.phone}) — email envoyé il y a ${Math.floor(age)} j`, call:true};
    if(age>=4 && isMobile(p.phone) && p.channel!=='WhatsApp') return {prio:3, who:'ines', label:'Message WhatsApp court (après l’appel)', wa:true};
    if(sent<3) return {prio:4, who:'clara', label:'Relance prévue automatiquement (Emails)', go:'emails'};
    return {prio:6, who:'ines', label:'Séquence terminée : laisser reposer 30 jours'};
  }
  return null;
}

function coachFacts(){
  const d=S.data, s=S.settings, ok=[], ko=[], todo=[];
  const sent=d.emails.filter(e=>e.status==='envoyé'), sentToday=sent.filter(e=>Date.now()-(e.sent_ts||0)<864e5).length;
  const toValidate=d.emails.filter(e=>e.status==='à valider').length, replied=d.prospects.filter(p=>['a répondu','rdv'].includes(p.status));
  const clients=d.prospects.filter(p=>p.status==='client').length, overdue=d.invoices.filter(i=>i.type==='facture'&&i.status!=='payée'&&i.due<Date.now());
  const toCall=d.prospects.filter(p=>p.status==='contacté'&&p.phone&&!p.called&&p.contacted_ts&&Date.now()-p.contacted_ts>2*864e5).length;
  if(d.prospects.length) ok.push(`${d.prospects.length} prospects vérifiés prêts à être contactés.`);
  if(clients) ok.push(`${clients} client${clients>1?'s':''} signé${clients>1?'s':''}.`);
  if(sent.length) ok.push(`${sent.length} emails déjà envoyés.`);
  if(replied.length) ok.push(`${replied.length} prospect${replied.length>1?'s ont':' a'} répondu ou pris rendez-vous.`);
  if(!s.company_name||!s.company_address) { ko.push('Ton entreprise n’est pas renseignée : aucun email ni facture ne peut partir.'); todo.push('Remplis raison sociale, SIRET et adresse dans Réglages.'); }
  if(s.paused==='on') { ko.push('L’équipe est en pause.'); todo.push('Relance l’équipe quand tu veux qu’elle travaille.'); }
  if(!s.payment_link && !s.iban) { ko.push('Aucun moyen d’encaisser : ni lien Stripe, ni IBAN.'); todo.push('Ajoute ton IBAN ou ton lien de paiement dans Réglages.'); }
  if(toValidate) todo.push(`Valide les ${toValidate} emails qui attendent dans l’onglet Emails.`);
  if(!d.prospects.some(p=>p.status!=='nouveau') && d.prospects.length) ko.push('Aucun prospect contacté pour l’instant : pas de contact, pas de vente.');
  if(replied.length) todo.push(`Réponds en priorité à ${replied.slice(0,3).map(p=>p.name||p.company).join(', ')}.`);
  if(toCall) todo.push(toCall>1?`Appelle les ${toCall} prospects contactés il y a plus de 2 jours.`:'Appelle le prospect contacté il y a plus de 2 jours.');
  if(overdue.length) { ko.push(`${overdue.length} facture${overdue.length>1?'s':''} en retard de paiement.`); todo.push('Fais relancer les factures en retard par Margaux.'); }
  if(sent.length && !sentToday && s.company_name) todo.push('Envoie ta série d’emails du jour (25 environ).');
  return {ok, ko, todo};
}

  on('#p-extract', async(ev)=>{ const raw=$('#p-raw').value.trim(); if(!raw) return; const b=ev.currentTarget; busyBtn(b,'Hugo extrait…'); try{ const n=await extractProspects(raw, $('#p-offer').value); toast(`${n} prospect(s) ajouté(s)`); $('#p-raw').value=''; const o=S.data.offers.find(x=>x.id===$('#p-offer').value); if(n&&o){ toast('Clara écrit les emails…'); await writeEmails(o); toast('Emails prêts dans l’onglet Emails'); } }catch(e){ toast(agentError(e)); } document.activeElement?.blur(); render(); });
  v.querySelectorAll('[data-pstatus]').forEach(s=>s.onchange=async()=>{ await upd('prospects', s.dataset.pstatus, {status:s.value, ...(s.value==='désinscrit'?{unsubscribed:true}:{}), ...(s.value==='client'?{client_ts:Date.now()}:{})}); s.blur();
    if(s.value==='client'){ const p=S.data.prospects.find(x=>x.id===s.dataset.pstatus); log('chloe', `🎉 Nouveau client : ${p.name||p.company}`, 'Margaux prépare la facture, Chloé lance la livraison.'); toast('Nouveau client ! Facture à établir dans Factures & compta'); }
    else toast('Statut mis à jour'); });
  v.querySelectorAll('[data-wa-done]').forEach(b=>b.onclick=async()=>{ const p=S.data.prospects.find(x=>x.id===b.dataset.waDone); busyBtn(b,'…'); await markContacted(p,'WhatsApp'); toast('Noté : contacté par WhatsApp'); });
  v.querySelectorAll('[data-reply]').forEach(b=>b.onclick=()=>{ const r=$('#reply-'+b.dataset.reply); r.hidden=!r.hidden; });
  v.querySelectorAll('[data-reply-go]').forEach(b=>b.onclick=async()=>{ const p=S.data.prospects.find(x=>x.id===b.dataset.replyGo), t=$('#reply-text-'+p.id).value.trim(); if(!t) return; busyBtn(b,'Inès analyse…'); try{ const r=await draftReply(p,t); toast('Réponse prête dans Emails'); $('#reply-text-'+p.id).blur(); }catch(e){ toast(agentError(e)); } render(); });
  v.querySelectorAll('[data-offer]').forEach(b=>b.onclick=async()=>{ await upd('offers', b.dataset.offer, {status:b.dataset.st}); });
  v.querySelectorAll('[data-camp]').forEach(b=>b.onclick=async()=>{ await upd('campaigns', b.dataset.camp, {status:b.dataset.st}); log('leo', `Campagne ${b.dataset.st} par le fondateur`); });
  on('#n-new', ()=>{ S.running=true; render(); const known=S.data.niches.map(n=>n.name).join(' ; '); researchNiches(`explore des secteurs NOUVEAUX, autres que ceux déjà étudiés (${known}). Cherche des métiers qui souffrent d'un problème concret et coûteux (rendez-vous non honorés, devis non relancés, appels manqués, avis en ligne, paperasse, recrutement…) et qui paient déjà pour s'en sortir`).catch(e=>toast(agentError(e))).finally(()=>{ S.running=false; S.step=''; render(); }); });
  on('#n-go', ()=>{ const f=$('#n-focus').value.trim(); $('#n-focus').blur(); S.running=true; render(); researchNiches(f).catch(e=>toast(agentError(e))).finally(()=>{ S.running=false; S.step=''; render(); }); });
  const form=$('#set-form'); if(form) form.onsubmit=async e=>{ e.preventDefault(); await saveSettings(Object.fromEntries(new FormData(form))); document.activeElement?.blur(); toast('Réglages enregistrés'); render(); };
}

// ============================================================ démarrage
(async function start(){
  const v=location.hash.slice(1); if(TABS.some(t=>t[0]===v)) S.view=v;
  render();
  const use = n => (window.claude?.use ? window.claude.use(n) : Promise.resolve(null)).catch(()=>null);
  const [db, sample, mcp, downloads, tts] = await Promise.all([use('db'), use('sample'), use('mcp'), use('downloads'), use('tts')]);
  S.db=db; S.sample=sample; S.mcp=mcp; S.downloads=downloads; SPK.tts=tts;
  if(tts){ tts.onState(({state})=>{ SPK.talking = state==='speaking' || state==='starting'; if(state==='idle'){ SPK.playing=false; } renderSpeaker(); }); tts.onLine(({line,id})=>{ const p=(SPK.parts||[])[line]; const part=p?.agent || String(id||'').split('|')[0]; if(AGENTS[part]){ SPK.agent=part; if(p) SPK.text=p.text; renderSpeaker(); } }); }
  if(db) subscribe(); else render();
})();
</script>
